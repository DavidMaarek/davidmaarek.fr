# =============================================================================
# Nginx config pour le conteneur davidmaarek.fr.
# Remplace les vhosts legacy :
#   - /etc/nginx/sites-available/davidmaarek.fr.conf
#   - /etc/nginx/sites-available/preprod.davidmaarek.fr
#
# Le même conteneur sert la prod (davidmaarek.fr) ET la preprod
# (preprod.davidmaarek.fr) — c'est Traefik qui route en amont selon le Host.
# Cette config nginx gère 3 cas distincts via 2 server blocks :
#   1. Host = www.davidmaarek.fr        → 301 vers l'apex (canonique = apex)
#   2. Host = davidmaarek.fr            → sert le contenu
#   3. Host = preprod.davidmaarek.fr    → sert le contenu (BasicAuth déjà
#                                         appliquée par Traefik en amont)
#
# Ce qu'on a viré (géré par Traefik maintenant) :
#   - listen 443 ssl + ssl_certificate         → Traefik termine HTTPS
#   - HTTP→HTTPS redirect                      → Traefik le fait au niveau entrypoint
#   - auth_basic                               → middleware Traefik `preprod-auth`
#                                                (appliqué uniquement sur le service preprod)
#   - access_log / error_log fichiers          → le conteneur log sur stdout/stderr,
#                                                visible via `docker service logs`
#
# Ce qu'on a gardé et amélioré :
#   - `error_page 404 /` (ancienne conf) → remplacé par un 301 vers `/`.
#     L'ancien comportement servait silencieusement /index.html sur n'importe
#     quelle URL inexistante (status 200), ce qui causait :
#       - URL bidon visible dans la barre d'adresse du browser
#       - Duplicate content côté SEO
#       - CSS/JS cassés si l'URL contenait un segment (ex: /tools/xxx) car
#         les chemins relatifs (`css/main.css`) étaient résolus depuis le
#         mauvais path → 404 sur les assets.
#     La 301 vers `/` règle les 3 problèmes.
# =============================================================================

# -----------------------------------------------------------------------------
# Server block 1 : redirect www → apex (apex est canonique).
# Match strict sur server_name www.davidmaarek.fr : si le Host est exactement
# ça, on renvoie un 301. Pour tous les autres Host, ce block ne matche pas
# et la requête tombe sur le default_server ci-dessous.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.davidmaarek.fr;

    # Traefik termine HTTPS, donc côté nginx on est en HTTP — mais on sait
    # qu'on est servi via HTTPS publiquement, donc on écrit https:// en dur.
    return 301 https://davidmaarek.fr$request_uri;
}

# -----------------------------------------------------------------------------
# Server block 2 : default — sert le contenu pour tous les autres Host.
# Couvre davidmaarek.fr, preprod.davidmaarek.fr, et n'importe quel Host qui
# atteindrait le conteneur via Traefik (Traefik route uniquement les Hosts
# déclarés dans ses routers, donc en pratique seulement ceux-là).
# -----------------------------------------------------------------------------
server {
    # Écoute sur IPv4 ET IPv6 :
    #   - IPv4 : pour Traefik et les requêtes externes
    #   - IPv6 : pour que les healthchecks Docker (qui résolvent `localhost`
    #     en `::1` sur Alpine) puissent atteindre nginx
    # `default_server` : ce block prend toute requête HTTP qui ne match aucun
    # autre server_name explicite (en pratique : tout sauf www.davidmaarek.fr).
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sert le fichier exact, sinon le dossier (et son index.html),
    # sinon balance un 404 — qui sera intercepté par error_page ci-dessous.
    location / {
        try_files $uri $uri/ =404;
    }

    # Toute 404 → redirect 301 vers la racine. Le browser change l'URL,
    # ce qui évite le bug des assets relatifs cassés.
    error_page 404 = @redirect_root;
    location @redirect_root {
        return 301 /;
    }

    # Long cache pour les assets (CSS, fonts, images). Si tu modifies un
    # asset, change son nom (ex: main.v2.css) sinon le cache browser
    # gardera l'ancienne version.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Ne jamais cacher index.html — c'est le point d'entrée, doit toujours
    # refléter la dernière version déployée.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Gzip à la volée pour les fichiers texte.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
